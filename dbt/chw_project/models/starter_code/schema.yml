version: 2

models:
  - name: chw_activity_monthly
    description: |
      Monthly aggregated view of CHW (CHV) activities.

      Grain:
        - One row per chv_id and report_month (first day of the month).

      Business rule:
        - Activities on or after day 26 are assigned to the next month.

    columns:
      - name: chv_id
        description: "Unique identifier for the CHW (CHV)."
        tests:
          - not_null

      - name: report_month
        description: "First day of reporting month. Activities on/after 26th go to next month."
        tests:
          - not_null

      - name: total_activities
        description: "Total number of activities performed by this CHW in this month."

      - name: unique_households_visited
        description: "Distinct households visited by CHW this month."

      - name: unique_patients_served
        description: "Distinct patients served (NULLs ignored)."

      - name: pregnancy_visits
        description: "Count of pregnancy_visit activities."

      - name: child_assessments
        description: "Count of child_assessment activities."

      - name: family_planning_visits
        description: "Count of family_planning activities."

    tests:
      - unique_combination_of_columns:
          combination_of_columns:
            - chv_id
            - report_month

