models:
  - name: chw_activity_monthly
    description:
      Monthly aggregated view of CWH (CHV) activities.
      Grain: one row per chv_id and report_month (first day of the month).
      Business rule: activities on/after day 26 are assigned to the next month.
    columns:
      - name: chv_id
        description: "Unique identifier for the CHW (CHV)."
        tests:
          - not_null
      - name: report_month
        description: "First day of reporting month (DATE). Activities on/after 26th are assigned to the next month."
        tests:
          - not_null
      - name: total_activities
        description: "Total number of activities performed by this CHW in this month."
      - name: unique_households_visited
        description: "Number of distinct households visited by CWH in this month."
      - name: unique_patients_served
        description: "Number of distinct patients served by CHW in this month(NULLs ignored)."
      - name: pregnancy_visits
        description: "Count of activities where activity_type = 'pregnancy_visit'."
      - name: child_assessments
        description: "Count of activities where activity_type = 'child_assessment'."
      - name: family_planning_visits
        description: "Count of activities where activity_type = 'family_planning'."

    tests:
      - unique:
        column_names: chv_id
      - unique:
        column_name: report_month

    
