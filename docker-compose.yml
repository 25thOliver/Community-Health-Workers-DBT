services:
  postgres:
    image: postgres:15
    container_name: dbt_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbt_password}
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.7.latest
    container_name: dbt_runner
    entrypoint: ["/bin/bash", "-c"]
    command: ["tail -f /dev/null"]
    working_dir: /usr/app/chw_project
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-dbt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbt_password}
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
      POSTGRES_SCHEMA: public
      DBT_PROFILES_DIR: /usr/app/chw_project
    volumes:
      - ./dbt:/usr/app
    depends_on:
      - postgres

volumes:
  postgres_data: